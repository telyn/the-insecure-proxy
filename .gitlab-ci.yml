variables:
  K8S_KUSTOMIZE_ENABLED: "true"
  KUBE_CONTEXT: telyn/cluster-management:home

stages:
  - test
  - build
  - package-build
  - package-test
  - publish
  - acceptance
  - production
  - deploy

include:
  - component: $CI_SERVER_FQDN/to-be-continuous/kubernetes/gitlab-ci-k8s@9
    inputs:
      base-app-name: the-insecure-proxy
      scripts-dir: k8s
      prod-space: the-insecure-proxy
      prod-deploy-strategy: auto
  - component: $CI_SERVER_FQDN/to-be-continuous/docker/gitlab-ci-docker@8
    inputs:
      build-tool: buildah
      build-args: "--platform linux/amd64 --platform linux/arm64"
      snapshot-image: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
      release-image: "${CI_REGISTRY_IMAGE}:latest"
      prod-publish-strategy: auto
      trivy-disabled: true
      sbom-disabled: true

docker-buildah-build:
  tags:
    - buildah

build:
  stage: build
  image: rust:1.99
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  tags:
    - $ARCH
  script:
    - cargo fetch
    - cargo test --all-targets
    - cargo build --release
    - mkdir -p "dist/${ARCH}"
    - cp target/release/the-insecure-proxy "dist/${ARCH}/"
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  artifacts:
    paths:
      - dist/
  cache:
    key: "build-${ARCH}"
    paths:
      - target
      - .cargo
